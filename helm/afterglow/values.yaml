# =============================================================================
# Afterglow Helm Chart — values.yaml
# 이 파일의 값만 수정하면 배포가 완료됩니다.
# 환경별 오버라이드: values-dev.yaml / values-prod.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# 이미지
# -----------------------------------------------------------------------------
image:
  backend:
    repository: ghcr.io/openstack-afterglow/afterglow-api
    tag: latest
    pullPolicy: Always
  frontend:
    repository: ghcr.io/openstack-afterglow/afterglow
    tag: latest
    pullPolicy: Always
  worker:
    repository: ghcr.io/openstack-afterglow/afterglow-worker
    tag: latest
    pullPolicy: Always

# -----------------------------------------------------------------------------
# 레플리카 수
# -----------------------------------------------------------------------------
replicaCount:
  backend: 2
  frontend: 2
  worker: 1
  notionWorker: 1
  redis: 3
  sentinel: 3

# -----------------------------------------------------------------------------
# 인그레스
# -----------------------------------------------------------------------------
ingress:
  host: afterglow.example.com
  certIssuer: letsencrypt-prod-traefik
  tlsSecretName: afterglow-tls
  ingressClass: traefik

# -----------------------------------------------------------------------------
# 시크릿 (실제 값은 --set 또는 values-prod.yaml 로 주입)
# -----------------------------------------------------------------------------
secrets:
  osPassword: ""
  secretKey: ""
  gitlabOidcClientSecret: ""
  k3sKubeconfigEncryptionKey: ""
  databaseUrl: ""
  prometheusPassword: ""
  monitoringSDToken: ""
  notionConfigEncryptionKey: ""
  smtpPassword: ""
  # 멀티라인 PEM 키: |로 시작하는 블록 스칼라로 입력
  builderSshPrivateKey: ""
  # Grafana 관리자 비밀번호 (반드시 배포 시 --set으로 주입)
  grafanaAdminPassword: ""

# -----------------------------------------------------------------------------
# [openstack]
# -----------------------------------------------------------------------------
openstack:
  authUrl: "http://keystone.example.com:5000/v3"
  projectName: "admin"
  projectDomainName: "Default"
  userDomainName: "Default"
  regionName: "RegionOne"
  username: "admin"
  interface: "internal"
  insecure: false
  cacert: ""
  # Manila
  manilaEndpoint: ""
  manilaShareNetworkId: ""
  manilaShareType: "cephfs"
  manilaNfsShareType: "nfstype"
  manilaNfsRootSquash: true
  manilaNfsSecFlavor: "sys"
  manilaCephxKeyTimeoutSeconds: 300
  # Ceph / Union
  cephMonitors: ""
  serviceProjectId: ""
  # Swift
  swiftEndpoint: ""
  swiftUploadTimeout: 600
  trashRetentionDays: 30
  # S3 (CSP frame-src용)
  s3Endpoint: "https://s3.dmslab.re.kr"

# -----------------------------------------------------------------------------
# [app]
# -----------------------------------------------------------------------------
app:
  backendPort: 8000
  frontendPort: 3080
  siteName: "Afterglow"
  siteDescription: "OpenStack VM + OverlayFS 배포 플랫폼"
  logoPath: "/logo.png"
  faviconPath: "/favicon.ico"
  refreshIntervalMs: 5000
  frontendBaseUrl: ""
  trustedProxies: "127.0.0.1/32,::1/128"

# -----------------------------------------------------------------------------
# [cache]
# -----------------------------------------------------------------------------
cache:
  ttlFast: 15
  ttlNormal: 30
  ttlSlow: 60
  ttlStatic: 300
  defaultTtlSeconds: 30
  backend: "redis"
  dynamicThresholdLow: 5
  dynamicThresholdHigh: 20
  ttlIdentityStable: 86400
  ttlCatalogSlow: 900
  ttlProjectMeta: 300
  ttlOperationalLive: 30
  ttlAdminOverview: 60
  ttlAuthToken: 60

# -----------------------------------------------------------------------------
# [session]
# -----------------------------------------------------------------------------
session:
  timeoutSeconds: 3600
  warningBeforeSeconds: 300
  absoluteTimeout: 14400
  jwtAccessTtl: 900
  jwtRefreshTtl: 604800
  tokenIpBindingMode: "subnet"

# -----------------------------------------------------------------------------
# [nova]
# -----------------------------------------------------------------------------
nova:
  defaultNetworkId: ""
  defaultAvailabilityZone: "nova"
  bootVolumeSizeGb: 20
  upperVolumeSizeGb: 50
  defaultNetworkEnabled: true
  defaultNetworkCidr: "192.168.0.0/24"
  defaultNetworkExternalId: ""

# -----------------------------------------------------------------------------
# [builder]
# -----------------------------------------------------------------------------
builder:
  imageId: ""
  flavorId: ""
  networkId: ""
  persistentServerId: ""
  sshUser: "ubuntu"
  sshKeyPath: "/etc/afterglow/ssh/builder.key"
  sshHost: ""
  floatingNetworkId: ""
  buildTimeout: 3600

# -----------------------------------------------------------------------------
# [union]
# -----------------------------------------------------------------------------
union:
  layerStoreRwShareId: ""
  layerStoreRoShareId: ""
  manifestStoreShareId: ""

# -----------------------------------------------------------------------------
# [gpu]
# -----------------------------------------------------------------------------
gpu:
  availableVisible: false

# -----------------------------------------------------------------------------
# [services]
# -----------------------------------------------------------------------------
services:
  magnum: false
  manila: true
  zun: false
  k3s: true
  swift: false
  trove: false
  barbican: false

# -----------------------------------------------------------------------------
# [k3s]
# -----------------------------------------------------------------------------
k3s:
  version: ""
  serverFlavorId: ""
  defaultAgentFlavorId: ""
  serverImageId: ""
  fcosImageId: ""
  callbackBaseUrl: ""
  bootVolumeSizeGb: 50
  occmEnabled: false
  occmImage: ""
  occmFloatingNetworkId: ""
  occmPublicNetworkName: ""
  cinderCsiEnabled: false
  cinderCsiImage: ""
  cinderCsiDefaultAz: ""
  manilaCsiEnabled: false
  manilaCsiImage: ""
  manilaCsiNfsImage: ""
  manilaCsiShareProtocol: "NFS"
  keystoneAuthEnabled: false
  keystoneAuthImage: ""
  keystoneAuthPolicy: ""
  octaviaIngressEnabled: false
  octaviaIngressImage: ""
  octaviaIngressSubnetId: ""
  octaviaIngressFloatingNetworkId: ""
  barbicanKmsEnabled: false
  barbicanKmsImage: ""
  barbicanKmsKekId: ""
  apiLbEnabled: false
  apiLbVipNetworkId: ""
  apiLbFloatingNetworkId: ""
  lbSubnetId: ""
  certRotationJobImage: ""
  certRotationNodeTimeoutSec: 300
  stampedeEnabled: false
  stampedeProjectId: ""
  stampedeInterval: 60
  stampedeScaleDownWindow: 300
  stampedeScaleUpCooldown: 120
  stampedeScaleDownCooldown: 300
  stampedeScaleDownThreshold: 0.3
  stampedeResourceHeadroomFactor: 1.2

# -----------------------------------------------------------------------------
# [database]
# -----------------------------------------------------------------------------
database:
  poolSize: 10
  maxOverflow: 20
  autoCreateTables: true
  connectTimeout: 10
  poolTimeout: 30
  unhealthySeconds: 60
  dbAutoBackupCron: ""

# -----------------------------------------------------------------------------
# [cors]
# -----------------------------------------------------------------------------
cors:
  origins: "https://afterglow.example.com"

# -----------------------------------------------------------------------------
# [gitlab_oidc]
# -----------------------------------------------------------------------------
gitlabOidc:
  enabled: false
  gitlabUrl: "https://gitlab.com"
  clientId: ""
  idpId: "gitlab"
  protocolId: "openid"
  redirectUri: ""
  scopes: "openid email profile read_user"

# -----------------------------------------------------------------------------
# [smtp]
# -----------------------------------------------------------------------------
smtp:
  enabled: false
  host: ""
  port: 587
  username: ""
  fromAddress: "noreply@afterglow.example.com"
  fromName: "Afterglow"
  useTls: true
  timeoutSeconds: 10
  invitation:
    tokenExpiryDays: 7

# -----------------------------------------------------------------------------
# [monitoring]
# -----------------------------------------------------------------------------
monitoring:
  enabled: true
  prometheusBaseUrl: "http://prometheus:9090"
  prometheusUsername: ""
  scrapeCidr: ""
  autoSgEnabled: true
  nodeExporterSgName: "node_exporter"
  dcgmExporterSgName: "dcgm_exporter"
  nodeExporterPort: 9100
  dcgmExporterPort: 9400
  libvirtExporterPort: 9177
  gpuFlavorPrefix: "gpu."
  grafanaBaseUrl: ""
  dashboards:
    nodeUid: "afterglow-node"
    rabbitmqUid: "afterglow-rabbitmq"
    mysqldUid: "afterglow-mysqld"
    memcachedUid: "afterglow-memcached"
    etcdUid: "afterglow-etcd"
    haproxyUid: "afterglow-haproxy"
    libvirtUid: "afterglow-libvirt"
    openstackUid: "afterglow-openstack"
    cephUid: "afterglow-ceph"
    instanceCpuUid: "afterglow-instance-cpu"
    instanceGpuUid: "afterglow-instance-gpu"
  grafana:
    image: "grafana/grafana:11.0.0"
    # adminPassword는 secrets.grafanaAdminPassword 로 주입됩니다
    replicas: 1
  prometheus:
    image: "prom/prometheus:v2.51.0"
    replicas: 1
  opensearch:
    enabled: false
    image: "opensearchproject/opensearch:2.13.0"
    replicas: 1
    storageSize: "10Gi"
    javaOpts: "-Xms512m -Xmx512m"
    # 보안 플러그인 비활성화 여부 (기본 false = 보안 활성화)
    # 개발 환경에서만 true로 설정할 것
    disableSecurityPlugin: false

# -----------------------------------------------------------------------------
# [notion]
# -----------------------------------------------------------------------------
notion:
  enabled: false

# -----------------------------------------------------------------------------
# [logging]
# -----------------------------------------------------------------------------
logging: {}

# -----------------------------------------------------------------------------
# [security]
# -----------------------------------------------------------------------------
security:
  adminLegacyProjectPolicy: false
  loginMaxAttempts: 10
  loginLockoutSeconds: 300
  loginBackoffBase: 2

# -----------------------------------------------------------------------------
# 리소스 요청/제한
# -----------------------------------------------------------------------------
resources:
  backend:
    requests:
      memory: "512Mi"
      cpu: "1"
    limits:
      memory: "2Gi"
      cpu: "4"
  frontend:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "300m"
  worker:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "300m"
  notionWorker:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  redis:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  sentinel:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "64Mi"
      cpu: "100m"
  grafana:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  prometheus:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  opensearch:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "500m"
