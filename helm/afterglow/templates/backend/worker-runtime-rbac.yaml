{{- if and (eq .Values.workerRuntime.mode "kubernetes") .Values.workerRuntime.kubernetes.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workerRuntime.kubernetes.serviceAccountName | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
    afterglow.worker-runtime: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-role" .Values.workerRuntime.kubernetes.serviceAccountName | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
    afterglow.worker-runtime: "true"
# 최소권한: 매니저는 deployment 를 조회하고 /scale 서브리소스만 patch 한다.
# deployments 전체 patch/update 를 주지 않으므로 image/command 등 스펙은 변경할 수 없고,
# pods 권한은 어댑터가 사용하지 않으므로 부여하지 않는다(SA 토큰 유출 시 노출 최소화).
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs:
      - get
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-binding" .Values.workerRuntime.kubernetes.serviceAccountName | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
    afterglow.worker-runtime: "true"
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workerRuntime.kubernetes.serviceAccountName | quote }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-role" .Values.workerRuntime.kubernetes.serviceAccountName | quote }}
{{- end }}
