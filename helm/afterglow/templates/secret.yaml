apiVersion: v1
kind: Secret
metadata:
  name: afterglow-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  OS_PASSWORD: {{ .Values.secrets.osPassword | quote }}
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  GITLAB_OIDC_CLIENT_SECRET: {{ .Values.secrets.gitlabOidcClientSecret | quote }}
  K3S_KUBECONFIG_ENCRYPTION_KEY: {{ .Values.secrets.k3sKubeconfigEncryptionKey | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  PROMETHEUS_PASSWORD: {{ .Values.secrets.prometheusPassword | quote }}
  MONITORING_SD_TOKEN: {{ .Values.secrets.monitoringSDToken | quote }}
  NOTION_CONFIG_ENCRYPTION_KEY: {{ .Values.secrets.notionConfigEncryptionKey | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  BUILDER_SSH_PRIVATE_KEY: {{ .Values.secrets.builderSshPrivateKey | quote }}
