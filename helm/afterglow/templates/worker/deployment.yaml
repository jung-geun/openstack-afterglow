apiVersion: apps/v1
kind: Deployment
metadata:
  name: drover
  namespace: {{ .Release.Namespace }}
  labels:
    app: drover
spec:
  replicas: {{ .Values.replicaCount.worker }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: drover
  template:
    metadata:
      labels:
        app: drover
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: {{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          command:
            - "python"
            - "-m"
            - "app.worker"
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: afterglow-config
                  key: APP_REDIS_URL
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: OS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: SECRET_KEY
            - name: K3S_KUBECONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: K3S_KUBECONFIG_ENCRYPTION_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: DATABASE_URL
            - name: K3S_HEALTH_INTERVAL
              value: "180"
          volumeMounts:
            - name: afterglow-config-volume
              mountPath: /app/config.toml
              subPath: config.toml
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
      volumes:
        - name: afterglow-config-volume
          configMap:
            name: afterglow-config
            items:
              - key: config.toml
                path: config.toml
