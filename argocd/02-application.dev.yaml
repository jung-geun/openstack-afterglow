apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: afterglow-dev
  namespace: argocd
  annotations:
    # ArgoCD Image Updater: :dev 태그의 digest 변경을 감지하여 자동 재배포
    argocd-image-updater.argoproj.io/image-list: |
      backend=ghcr.io/openstack-afterglow/afterglow-api:dev,frontend=ghcr.io/openstack-afterglow/afterglow:dev
    argocd-image-updater.argoproj.io/backend.update-strategy: digest
    argocd-image-updater.argoproj.io/frontend.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: afterglow
  source:
    repoURL: "https://github.com/openstack-afterglow/openstack-afterglow.git"
    targetRevision: dev
    path: deploy/k8s-template/overlays/dev
  destination:
    server: "https://kubernetes.default.svc"
    namespace: afterglow-dev
  # Ingress spec.rules / spec.tls 는 최초 생성 후 운영자가 직접 패치하므로
  # ArgoCD가 git의 placeholder 값으로 되돌리지 않도록 무시
  ignoreDifferences:
  - group: networking.k8s.io
    kind: Ingress
    name: afterglow-ingress
    namespace: afterglow-dev
    jsonPointers:
    - /spec/rules
    - /spec/tls

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
