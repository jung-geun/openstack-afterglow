apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: afterglow-prod
  namespace: argocd
  annotations:
    # ArgoCD Image Updater: :latest 태그의 digest 변경을 감지하여 자동 재배포
    argocd-image-updater.argoproj.io/image-list: |
      backend=ghcr.io/openstack-afterglow/afterglow-api:latest,frontend=ghcr.io/openstack-afterglow/afterglow:latest
    argocd-image-updater.argoproj.io/backend.update-strategy: digest
    argocd-image-updater.argoproj.io/frontend.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: afterglow
  source:
    repoURL: "https://github.com/openstack-afterglow/openstack-afterglow.git"
    targetRevision: main
    path: deploy/k8s-template/overlays/prod
  destination:
    server: "https://kubernetes.default.svc"
    namespace: afterglow
  # Ingress spec.rules / spec.tls 는 최초 생성 후 운영자가 직접 패치하므로
  # ArgoCD가 git의 placeholder 값으로 되돌리지 않도록 무시
  ignoreDifferences:
  - group: networking.k8s.io
    kind: Ingress
    name: afterglow-ingress
    namespace: afterglow
    jsonPointers:
    - /spec/rules
    - /spec/tls
  # 참고: worker_runtime kubernetes 모드를 이 kustomize 경로에서 활성화할 때에만
  # drover/notion-worker 의 /spec/replicas 를 여기에 추가한다(static 모드에서는 추가 금지 —
  # ArgoCD 의 replica drift 복구를 유지해야 함). 실 배포(Helm)는 생성기가 mode 에 따라 자동 처리한다.

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
