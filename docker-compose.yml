# 개발 환경용 docker-compose
# 프로덕션은 docker-compose.prod.yml 참고
services:
  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Local databases for all extracted services. Start the service stack with:
  # docker compose --env-file .env --env-file docker-compose.services.env --profile services up service-mariadb waygate-api waygate-worker drover-api drover-worker lumen-api lumen-worker palimpsest-api palimpsest-worker
  service-mariadb:
    profiles: ["services"]
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: dev
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - service-mariadb-data:/var/lib/mysql
      - ./docker/mariadb/service-init.sql:/docker-entrypoint-initdb.d/00-services.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  waygate-api:
    profiles: ["services", "waygate"]
    image: ${WAYGATE_API_IMAGE:-ghcr.io/openstack-afterglow/waygate-api:dev}
    ports:
      - "8010:8010"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${WAYGATE_DATABASE_URL:-mysql+aiomysql://waygate:dev@service-mariadb:3306/waygate}
      REDIS_URL: redis://redis:6379/6
      OS_AUTH_URL: ${WAYGATE_OS_AUTH_URL:-${OS_AUTH_URL:-}}
      OS_USERNAME: ${WAYGATE_OS_USERNAME:-${OS_USERNAME:-}}
      OS_PASSWORD: ${WAYGATE_OS_PASSWORD:-${OS_PASSWORD:-}}
      OS_PROJECT_NAME: ${WAYGATE_OS_PROJECT_NAME:-${OS_PROJECT_NAME:-}}
      OS_PROJECT_DOMAIN_NAME: ${WAYGATE_OS_PROJECT_DOMAIN_NAME:-${OS_PROJECT_DOMAIN_NAME:-}}
      OS_USER_DOMAIN_NAME: ${WAYGATE_OS_USER_DOMAIN_NAME:-${OS_USER_DOMAIN_NAME:-}}
      OS_REGION_NAME: ${WAYGATE_OS_REGION_NAME:-${OS_REGION_NAME:-}}
      OS_INTERFACE: ${WAYGATE_OS_INTERFACE:-${OS_INTERFACE:-}}
      WAYGATE_CALLBACK_BASE_URL: ${WAYGATE_CALLBACK_BASE_URL:-http://localhost:8010}
      WAYGATE_KEY_NAME: ${WAYGATE_KEY_NAME:-}
      WAYGATE_ENCRYPTION_KEY: ${WAYGATE_ENCRYPTION_KEY:-${K3S_KUBECONFIG_ENCRYPTION_KEY:-}}
      WAYGATE_CONFIG_FILE: /etc/afterglow/afterglow.conf
    volumes:
      - ./afterglow.conf:/etc/afterglow/afterglow.conf:ro
    depends_on:
      waygate-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/v1/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  waygate-worker:
    profiles: ["services", "waygate"]
    image: ${WAYGATE_WORKER_IMAGE:-ghcr.io/openstack-afterglow/waygate-worker:dev}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${WAYGATE_DATABASE_URL:-mysql+aiomysql://waygate:dev@service-mariadb:3306/waygate}
      REDIS_URL: redis://redis:6379/6
      OS_AUTH_URL: ${WAYGATE_OS_AUTH_URL:-${OS_AUTH_URL:-}}
      OS_USERNAME: ${WAYGATE_OS_USERNAME:-${OS_USERNAME:-}}
      OS_PASSWORD: ${WAYGATE_OS_PASSWORD:-${OS_PASSWORD:-}}
      OS_PROJECT_NAME: ${WAYGATE_OS_PROJECT_NAME:-${OS_PROJECT_NAME:-}}
      OS_PROJECT_DOMAIN_NAME: ${WAYGATE_OS_PROJECT_DOMAIN_NAME:-${OS_PROJECT_DOMAIN_NAME:-}}
      OS_USER_DOMAIN_NAME: ${WAYGATE_OS_USER_DOMAIN_NAME:-${OS_USER_DOMAIN_NAME:-}}
      OS_REGION_NAME: ${WAYGATE_OS_REGION_NAME:-${OS_REGION_NAME:-}}
      OS_INTERFACE: ${WAYGATE_OS_INTERFACE:-${OS_INTERFACE:-}}
      WAYGATE_CALLBACK_BASE_URL: ${WAYGATE_CALLBACK_BASE_URL:-http://localhost:8010}
      WAYGATE_KEY_NAME: ${WAYGATE_KEY_NAME:-}
      WAYGATE_ENCRYPTION_KEY: ${WAYGATE_ENCRYPTION_KEY:-${K3S_KUBECONFIG_ENCRYPTION_KEY:-}}
      WAYGATE_CONFIG_FILE: /etc/afterglow/afterglow.conf
    volumes:
      - ./afterglow.conf:/etc/afterglow/afterglow.conf:ro
    depends_on:
      waygate-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  waygate-migrate:
    profiles: ["services", "waygate"]
    image: ${WAYGATE_API_IMAGE:-ghcr.io/openstack-afterglow/waygate-api:dev}
    environment:
      DATABASE_URL: ${WAYGATE_DATABASE_URL:-mysql+aiomysql://waygate:dev@service-mariadb:3306/waygate}
      REDIS_URL: redis://redis:6379/6
      OS_AUTH_URL: ${WAYGATE_OS_AUTH_URL:-${OS_AUTH_URL:-}}
      OS_USERNAME: ${WAYGATE_OS_USERNAME:-${OS_USERNAME:-}}
      OS_PASSWORD: ${WAYGATE_OS_PASSWORD:-${OS_PASSWORD:-}}
      OS_PROJECT_NAME: ${WAYGATE_OS_PROJECT_NAME:-${OS_PROJECT_NAME:-}}
      OS_PROJECT_DOMAIN_NAME: ${WAYGATE_OS_PROJECT_DOMAIN_NAME:-${OS_PROJECT_DOMAIN_NAME:-}}
      OS_USER_DOMAIN_NAME: ${WAYGATE_OS_USER_DOMAIN_NAME:-${OS_USER_DOMAIN_NAME:-}}
      OS_REGION_NAME: ${WAYGATE_OS_REGION_NAME:-${OS_REGION_NAME:-}}
      OS_INTERFACE: ${WAYGATE_OS_INTERFACE:-${OS_INTERFACE:-}}
      WAYGATE_CALLBACK_BASE_URL: ${WAYGATE_CALLBACK_BASE_URL:-http://localhost:8010}
      WAYGATE_KEY_NAME: ${WAYGATE_KEY_NAME:-}
      WAYGATE_ENCRYPTION_KEY: ${WAYGATE_ENCRYPTION_KEY:-${K3S_KUBECONFIG_ENCRYPTION_KEY:-}}
      WAYGATE_CONFIG_FILE: /etc/afterglow/afterglow.conf
    volumes:
      - ./afterglow.conf:/etc/afterglow/afterglow.conf:ro
    command: python -m waygate.scripts.migrate --apply
    depends_on:
      redis:
        condition: service_started
      service-mariadb:
        condition: service_healthy
    restart: "no"

  # ── Worker runtime manager opt-in (disabled by default) ─────────────────────
  # The default development path keeps only the static notion-worker below.
  # To let the backend manage integration workers over the Docker API, use the
  # docker-compose.worker-runtime.yml overlay. Never mount the Docker socket in
  # this committed default compose file.

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: ghcr.io/openstack-afterglow/afterglow-api:dev
    ports:
      - "8000:8000"
    volumes:
      - ./afterglow.conf:/app/afterglow.conf:ro
      - ./config.gpu.toml:/app/config.gpu.toml:ro
      - ./logs:/app/logs
    env_file:
      - path: .env
        required: false
    environment:
      - LUMEN_MCP_SERVICE_TOKEN=${LUMEN_MCP_SERVICE_TOKEN:-}
      - SERVICE_WAYGATE_INTERNAL_URL=${SERVICE_WAYGATE_INTERNAL_URL:-}
      - SERVICE_DROVER_INTERNAL_URL=${SERVICE_DROVER_INTERNAL_URL:-}
      - SERVICE_LUMEN_INTERNAL_URL=${SERVICE_LUMEN_INTERNAL_URL:-}
      - SERVICE_PALIMPSEST_INTERNAL_URL=${SERVICE_PALIMPSEST_INTERNAL_URL:-http://palimpsest-api:8020}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s


  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    image: ghcr.io/openstack-afterglow/afterglow:dev
    ports:
      - "3080:3080"
    volumes:
      - ./afterglow.conf:/app/afterglow.conf:ro
      - ./logs:/app/logs
    environment:
      - ORIGIN=http://localhost:3080
      - PUBLIC_API_BASE=http://localhost:8000
      - PUBLIC_S3_BASE=https://s3.dmslab.re.kr
      - PUBLIC_GRAFANA_BASE=
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3080/health').then(r=>{if(!r.ok)throw 1})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Drover migration bootstrap ──────────────────────────────────────────────
  drover-migrate:
    profiles: ["services", "drover"]
    image: ${DROVER_API_IMAGE:-ghcr.io/openstack-afterglow/drover-api:dev}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DROVER_DATABASE_URL:-mysql+aiomysql://drover:dev@service-mariadb:3306/drover}
      REDIS_URL: redis://redis:6379/7
      OS_AUTH_URL: ${DROVER_OS_AUTH_URL:-${OS_AUTH_URL:-}}
      OS_USERNAME: ${DROVER_OS_USERNAME:-${OS_USERNAME:-}}
      OS_PASSWORD: ${DROVER_OS_PASSWORD:-${OS_PASSWORD:-}}
      OS_PROJECT_NAME: ${DROVER_OS_PROJECT_NAME:-${OS_PROJECT_NAME:-}}
      OS_PROJECT_DOMAIN_NAME: ${DROVER_OS_PROJECT_DOMAIN_NAME:-${OS_PROJECT_DOMAIN_NAME:-}}
      OS_USER_DOMAIN_NAME: ${DROVER_OS_USER_DOMAIN_NAME:-${OS_USER_DOMAIN_NAME:-}}
      OS_REGION_NAME: ${DROVER_OS_REGION_NAME:-${OS_REGION_NAME:-}}
      OS_INTERFACE: ${DROVER_OS_INTERFACE:-${OS_INTERFACE:-}}
      DROVER_CALLBACK_BASE_URL: ${DROVER_CALLBACK_BASE_URL:-http://localhost:8011}
      DROVER_KUBECONFIG_ENCRYPTION_KEY: ${DROVER_KUBECONFIG_ENCRYPTION_KEY:-${K3S_KUBECONFIG_ENCRYPTION_KEY:-}}
      DROVER_CONFIG_FILE: /etc/afterglow/afterglow.conf
    volumes:
      - ./afterglow.conf:/etc/afterglow/afterglow.conf:ro
    command: python -m drover.scripts.migrate --apply
    depends_on:
      redis:
        condition: service_started
      service-mariadb:
        condition: service_healthy
    restart: "no"

  # ── Drover API ───────────────────────────────────────────────────────────────
  drover-api:
    profiles: ["services", "drover"]
    image: ${DROVER_API_IMAGE:-ghcr.io/openstack-afterglow/drover-api:dev}
    ports:
      - "8011:8011"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DROVER_DATABASE_URL:-mysql+aiomysql://drover:dev@service-mariadb:3306/drover}
      REDIS_URL: redis://redis:6379/7
      OS_AUTH_URL: ${DROVER_OS_AUTH_URL:-${OS_AUTH_URL:-}}
      OS_USERNAME: ${DROVER_OS_USERNAME:-${OS_USERNAME:-}}
      OS_PASSWORD: ${DROVER_OS_PASSWORD:-${OS_PASSWORD:-}}
      OS_PROJECT_NAME: ${DROVER_OS_PROJECT_NAME:-${OS_PROJECT_NAME:-}}
      OS_PROJECT_DOMAIN_NAME: ${DROVER_OS_PROJECT_DOMAIN_NAME:-${OS_PROJECT_DOMAIN_NAME:-}}
      OS_USER_DOMAIN_NAME: ${DROVER_OS_USER_DOMAIN_NAME:-${OS_USER_DOMAIN_NAME:-}}
      OS_REGION_NAME: ${DROVER_OS_REGION_NAME:-${OS_REGION_NAME:-}}
      OS_INTERFACE: ${DROVER_OS_INTERFACE:-${OS_INTERFACE:-}}
      DROVER_CALLBACK_BASE_URL: ${DROVER_CALLBACK_BASE_URL:-http://localhost:8011}
      DROVER_KUBECONFIG_ENCRYPTION_KEY: ${DROVER_KUBECONFIG_ENCRYPTION_KEY:-${K3S_KUBECONFIG_ENCRYPTION_KEY:-}}
      DROVER_CONFIG_FILE: /etc/afterglow/afterglow.conf
    volumes:
      - ./afterglow.conf:/etc/afterglow/afterglow.conf:ro
    depends_on:
      redis:
        condition: service_started
      drover-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/v1/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ── Drover worker ────────────────────────────────────────────────────────────
  drover-worker:
    profiles: ["services", "drover"]
    image: ${DROVER_WORKER_IMAGE:-ghcr.io/openstack-afterglow/drover-worker:dev}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DROVER_DATABASE_URL:-mysql+aiomysql://drover:dev@service-mariadb:3306/drover}
      REDIS_URL: redis://redis:6379/7
      OS_AUTH_URL: ${DROVER_OS_AUTH_URL:-${OS_AUTH_URL:-}}
      OS_USERNAME: ${DROVER_OS_USERNAME:-${OS_USERNAME:-}}
      OS_PASSWORD: ${DROVER_OS_PASSWORD:-${OS_PASSWORD:-}}
      OS_PROJECT_NAME: ${DROVER_OS_PROJECT_NAME:-${OS_PROJECT_NAME:-}}
      OS_PROJECT_DOMAIN_NAME: ${DROVER_OS_PROJECT_DOMAIN_NAME:-${OS_PROJECT_DOMAIN_NAME:-}}
      OS_USER_DOMAIN_NAME: ${DROVER_OS_USER_DOMAIN_NAME:-${OS_USER_DOMAIN_NAME:-}}
      OS_REGION_NAME: ${DROVER_OS_REGION_NAME:-${OS_REGION_NAME:-}}
      OS_INTERFACE: ${DROVER_OS_INTERFACE:-${OS_INTERFACE:-}}
      DROVER_CALLBACK_BASE_URL: ${DROVER_CALLBACK_BASE_URL:-http://localhost:8011}
      DROVER_KUBECONFIG_ENCRYPTION_KEY: ${DROVER_KUBECONFIG_ENCRYPTION_KEY:-${K3S_KUBECONFIG_ENCRYPTION_KEY:-}}
      DROVER_CONFIG_FILE: /etc/afterglow/afterglow.conf
    volumes:
      - ./afterglow.conf:/etc/afterglow/afterglow.conf:ro
    depends_on:
      redis:
        condition: service_started
      drover-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  lumen-migrate:
    profiles: ["services", "lumen"]
    image: ${LUMEN_API_IMAGE:-ghcr.io/openstack-afterglow/lumen-api:dev}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${LUMEN_DATABASE_URL:-mysql+aiomysql://lumen:dev@service-mariadb:3306/lumen}
      REDIS_URL: redis://redis:6379/8
      KEYSTONE_AUTH_URL: ${LUMEN_KEYSTONE_AUTH_URL:-${OS_AUTH_URL:-}}
      KEYSTONE_ADMIN_USERNAME: ${LUMEN_KEYSTONE_ADMIN_USERNAME:-${OS_USERNAME:-}}
      KEYSTONE_ADMIN_PASSWORD: ${LUMEN_KEYSTONE_ADMIN_PASSWORD:-${OS_PASSWORD:-}}
      KEYSTONE_ADMIN_PROJECT: ${LUMEN_KEYSTONE_ADMIN_PROJECT:-${OS_PROJECT_NAME:-}}
      KEYSTONE_DOMAIN: ${LUMEN_KEYSTONE_DOMAIN:-${OS_USER_DOMAIN_NAME:-Default}}
      KEYSTONE_REGION_NAME: ${LUMEN_KEYSTONE_REGION_NAME:-${OS_REGION_NAME:-RegionOne}}
      KEYSTONE_INTERFACE: ${LUMEN_KEYSTONE_INTERFACE:-${OS_INTERFACE:-internal}}
      LUMEN_ENCRYPTION_KEY: ${LUMEN_ENCRYPTION_KEY:-}
      MCP_CONTROL_PLANE_URL: ${MCP_CONTROL_PLANE_URL:-http://backend:8000}
      LUMEN_MCP_SERVICE_TOKEN: ${LUMEN_MCP_SERVICE_TOKEN:-}
    command: python -m lumen.scripts.migrate --apply
    depends_on:
      redis:
        condition: service_started
      service-mariadb:
        condition: service_healthy
    restart: "no"

  # ── Lumen API ───────────────────────────────────────────────────────────────
  lumen-api:
    profiles: ["services", "lumen"]
    image: ${LUMEN_API_IMAGE:-ghcr.io/openstack-afterglow/lumen-api:dev}
    ports:
      - "8012:8012"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${LUMEN_DATABASE_URL:-mysql+aiomysql://lumen:dev@service-mariadb:3306/lumen}
      REDIS_URL: redis://redis:6379/8
      KEYSTONE_AUTH_URL: ${LUMEN_KEYSTONE_AUTH_URL:-${OS_AUTH_URL:-}}
      KEYSTONE_ADMIN_USERNAME: ${LUMEN_KEYSTONE_ADMIN_USERNAME:-${OS_USERNAME:-}}
      KEYSTONE_ADMIN_PASSWORD: ${LUMEN_KEYSTONE_ADMIN_PASSWORD:-${OS_PASSWORD:-}}
      KEYSTONE_ADMIN_PROJECT: ${LUMEN_KEYSTONE_ADMIN_PROJECT:-${OS_PROJECT_NAME:-}}
      KEYSTONE_DOMAIN: ${LUMEN_KEYSTONE_DOMAIN:-${OS_USER_DOMAIN_NAME:-Default}}
      KEYSTONE_REGION_NAME: ${LUMEN_KEYSTONE_REGION_NAME:-${OS_REGION_NAME:-RegionOne}}
      KEYSTONE_INTERFACE: ${LUMEN_KEYSTONE_INTERFACE:-${OS_INTERFACE:-internal}}
      LUMEN_ENCRYPTION_KEY: ${LUMEN_ENCRYPTION_KEY:-}
      MCP_CONTROL_PLANE_URL: ${MCP_CONTROL_PLANE_URL:-http://backend:8000}
      LUMEN_MCP_SERVICE_TOKEN: ${LUMEN_MCP_SERVICE_TOKEN:-}
    depends_on:
      lumen-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/v1/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ── Lumen worker ────────────────────────────────────────────────────────────
  lumen-worker:
    profiles: ["services", "lumen"]
    image: ${LUMEN_WORKER_IMAGE:-ghcr.io/openstack-afterglow/lumen-worker:dev}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${LUMEN_DATABASE_URL:-mysql+aiomysql://lumen:dev@service-mariadb:3306/lumen}
      REDIS_URL: redis://redis:6379/8
      KEYSTONE_AUTH_URL: ${LUMEN_KEYSTONE_AUTH_URL:-${OS_AUTH_URL:-}}
      KEYSTONE_ADMIN_USERNAME: ${LUMEN_KEYSTONE_ADMIN_USERNAME:-${OS_USERNAME:-}}
      KEYSTONE_ADMIN_PASSWORD: ${LUMEN_KEYSTONE_ADMIN_PASSWORD:-${OS_PASSWORD:-}}
      KEYSTONE_ADMIN_PROJECT: ${LUMEN_KEYSTONE_ADMIN_PROJECT:-${OS_PROJECT_NAME:-}}
      KEYSTONE_DOMAIN: ${LUMEN_KEYSTONE_DOMAIN:-${OS_USER_DOMAIN_NAME:-Default}}
      KEYSTONE_REGION_NAME: ${LUMEN_KEYSTONE_REGION_NAME:-${OS_REGION_NAME:-RegionOne}}
      KEYSTONE_INTERFACE: ${LUMEN_KEYSTONE_INTERFACE:-${OS_INTERFACE:-internal}}
      LUMEN_ENCRYPTION_KEY: ${LUMEN_ENCRYPTION_KEY:-}
      MCP_CONTROL_PLANE_URL: ${MCP_CONTROL_PLANE_URL:-http://backend:8000}
      LUMEN_MCP_SERVICE_TOKEN: ${LUMEN_MCP_SERVICE_TOKEN:-}
    depends_on:
      lumen-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Palimpsest Hub ──────────────────────────────────────────────────────────
  palimpsest-bootstrap:
    profiles: ["services", "palimpsest"]
    image: ${PALIMPSEST_API_IMAGE:-ghcr.io/openstack-afterglow/palimpsest-hub-api:dev}
    command: palimpsest-hub-bootstrap
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${PALIMPSEST_DATABASE_URL:-mysql+asyncmy://palimpsest:dev@service-mariadb:3306/palimpsest}
      REDIS_URL: redis://redis:6379/9
      PALIMPSEST_HUB_LOCAL_PATH: /var/lib/palimpsest/hub
      OS_AUTH_URL: ${PALIMPSEST_OS_AUTH_URL:-${OS_AUTH_URL:-}}
      OS_USERNAME: ${PALIMPSEST_OS_USERNAME:-palimpsest}
      OS_PASSWORD: ${PALIMPSEST_OS_PASSWORD:-${OS_PASSWORD:-}}
      OS_PROJECT_NAME: ${PALIMPSEST_OS_PROJECT_NAME:-palimpsest-service}
      OS_PROJECT_DOMAIN_NAME: ${PALIMPSEST_OS_PROJECT_DOMAIN_NAME:-Default}
      OS_USER_DOMAIN_NAME: ${PALIMPSEST_OS_USER_DOMAIN_NAME:-Default}
      OS_REGION_NAME: ${PALIMPSEST_OS_REGION_NAME:-RegionOne}
      OS_INTERFACE: ${PALIMPSEST_OS_INTERFACE:-internal}
      SSL_VERIFY: ${PALIMPSEST_SSL_VERIFY:-true}
    volumes:
      - palimpsest-hub:/var/lib/palimpsest/hub
    depends_on:
      redis:
        condition: service_started
      service-mariadb:
        condition: service_healthy
    restart: "no"

  palimpsest-api:
    profiles: ["services", "palimpsest"]
    image: ${PALIMPSEST_API_IMAGE:-ghcr.io/openstack-afterglow/palimpsest-hub-api:dev}
    ports:
      - "8020:8020"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${PALIMPSEST_DATABASE_URL:-mysql+asyncmy://palimpsest:dev@service-mariadb:3306/palimpsest}
      REDIS_URL: redis://redis:6379/9
      PALIMPSEST_HUB_LOCAL_PATH: /var/lib/palimpsest/hub
      OS_AUTH_URL: ${PALIMPSEST_OS_AUTH_URL:-${OS_AUTH_URL:-}}
      OS_USERNAME: ${PALIMPSEST_OS_USERNAME:-palimpsest}
      OS_PASSWORD: ${PALIMPSEST_OS_PASSWORD:-${OS_PASSWORD:-}}
      OS_PROJECT_NAME: ${PALIMPSEST_OS_PROJECT_NAME:-palimpsest-service}
      OS_PROJECT_DOMAIN_NAME: ${PALIMPSEST_OS_PROJECT_DOMAIN_NAME:-Default}
      OS_USER_DOMAIN_NAME: ${PALIMPSEST_OS_USER_DOMAIN_NAME:-Default}
      OS_REGION_NAME: ${PALIMPSEST_OS_REGION_NAME:-RegionOne}
      OS_INTERFACE: ${PALIMPSEST_OS_INTERFACE:-internal}
      SSL_VERIFY: ${PALIMPSEST_SSL_VERIFY:-true}
    volumes:
      - palimpsest-hub:/var/lib/palimpsest/hub
    depends_on:
      redis:
        condition: service_started
      palimpsest-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/v1/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  palimpsest-worker:
    profiles: ["services", "palimpsest"]
    image: ${PALIMPSEST_WORKER_IMAGE:-ghcr.io/openstack-afterglow/palimpsest-hub-worker:dev}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${PALIMPSEST_DATABASE_URL:-mysql+asyncmy://palimpsest:dev@service-mariadb:3306/palimpsest}
      REDIS_URL: redis://redis:6379/9
      PALIMPSEST_HUB_LOCAL_PATH: /var/lib/palimpsest/hub
      OS_AUTH_URL: ${PALIMPSEST_OS_AUTH_URL:-${OS_AUTH_URL:-}}
      OS_USERNAME: ${PALIMPSEST_OS_USERNAME:-palimpsest}
      OS_PASSWORD: ${PALIMPSEST_OS_PASSWORD:-${OS_PASSWORD:-}}
      OS_PROJECT_NAME: ${PALIMPSEST_OS_PROJECT_NAME:-palimpsest-service}
      OS_PROJECT_DOMAIN_NAME: ${PALIMPSEST_OS_PROJECT_DOMAIN_NAME:-Default}
      OS_USER_DOMAIN_NAME: ${PALIMPSEST_OS_USER_DOMAIN_NAME:-Default}
      OS_REGION_NAME: ${PALIMPSEST_OS_REGION_NAME:-RegionOne}
      OS_INTERFACE: ${PALIMPSEST_OS_INTERFACE:-internal}
      SSL_VERIFY: ${PALIMPSEST_SSL_VERIFY:-true}
    volumes:
      - palimpsest-hub:/var/lib/palimpsest/hub
    depends_on:
      redis:
        condition: service_started
      palimpsest-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Notion Sync Worker ────────────────────────────────────────────────────────
  notion-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: ghcr.io/openstack-afterglow/afterglow-worker:dev
    command: python -m app.notion_worker
    volumes:
      - ./afterglow.conf:/app/afterglow.conf:ro
      - ./config.gpu.toml:/app/config.gpu.toml:ro
      - ./logs:/app/logs
    env_file:
      - path: .env
        required: false
    # environment:
    #   - AFTERGLOW_ALLOW_INSECURE=1
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── 테스트 프로필 (docker compose --profile test up) ────────────────────────
  mariadb:
    image: mariadb:11.4
    profiles: ["test"]
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: dev
      MARIADB_DATABASE: afterglow_test
      MARIADB_USER: afterglow
      MARIADB_PASSWORD: dev
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16
    profiles: ["test"]
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: afterglow_checkpoints
      POSTGRES_USER: afterglow
      POSTGRES_PASSWORD: dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterglow -d afterglow_checkpoints"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ── 프록시 프로필 (docker compose --profile proxy up) ──────────────────────
  # 80 → HTTPS 리다이렉트, 443 SSL termination
  # /api/ → backend, 나머지 → frontend
  haproxy:
    build:
      context: ./haproxy
      dockerfile: Dockerfile
    profiles: [ "proxy" ]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - haproxy-certs:/etc/haproxy/certs
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── 모니터링 프로필 (docker compose --profile monitoring up) ──────────────

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    profiles: [ "monitoring" ]
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    profiles: [ "monitoring" ]
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - opensearch
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.51.0
    profiles: [ "monitoring" ]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.0.0
    profiles: [ "monitoring" ]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme_grafana}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
  service-mariadb-data:
  opensearch-data:
  prom-data:
  grafana-data:
  haproxy-certs:
  palimpsest-hub:
