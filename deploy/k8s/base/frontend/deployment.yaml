apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: afterglow
  labels:
    app: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: frontend
          image: ghcr.io/jung-geun/afterglow:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: afterglow-config
                  key: APP_ORIGIN
            - name: PUBLIC_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: afterglow-config
                  key: APP_ORIGIN
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "300m"
