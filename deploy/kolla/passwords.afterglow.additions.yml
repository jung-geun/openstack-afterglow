---
# Afterglow passwords additions
# kolla-genpwd 실행 후 /etc/kolla/passwords.yml 끝에 붙여넣거나
# install.sh --apply-passwords 로 자동 merge

# afterglow MariaDB 사용자 비밀번호
afterglow_database_password:

# FastAPI 세션/JWT 서명 키 (64-char hex)
# 생성: python3 -c "import secrets; print(secrets.token_hex(32))"
afterglow_secret_key:

# k3s kubeconfig AES-256-GCM 암호화 키 (64-char hex)
# 생성: openssl rand -hex 32
afterglow_kubeconfig_encryption_key:

# GitLab OIDC Client Secret
afterglow_oidc_client_secret:

# Keystone afterglow_admin 사용자 비밀번호
afterglow_admin_keystone_password:
