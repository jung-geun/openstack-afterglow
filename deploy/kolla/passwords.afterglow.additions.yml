---
# Afterglow passwords additions
# kolla-genpwd 실행 후 /etc/kolla/passwords.yml 끝에 붙여넣거나
# install.sh --apply-passwords 로 자동 merge

# afterglow MariaDB 사용자 비밀번호
afterglow_database_password:

# FastAPI 세션/JWT 서명 키 (64-char hex)
# 생성: python3 -c "import secrets; print(secrets.token_hex(32))"
afterglow_secret_key:

# k3s kubeconfig AES-256-GCM 암호화 키 (64-char hex)
# 생성: openssl rand -hex 32
afterglow_kubeconfig_encryption_key:

# GitLab OIDC Client Secret
afterglow_oidc_client_secret:

# Keystone afterglow_admin 사용자 비밀번호
afterglow_admin_keystone_password:

# Waygate MariaDB user password
waygate_database_password:

# Waygate Keystone service-user password
waygate_keystone_password:

# Optional password for a dedicated Waygate Redis deployment
waygate_redis_password:

# Drover MariaDB user password
drover_database_password:

# Drover Keystone service-user password
drover_keystone_password:

# Optional password for a dedicated Drover Redis deployment
drover_redis_password:

# Lumen MariaDB user password
lumen_database_password:

# Lumen Keystone service-user password
lumen_keystone_password:

# Optional password for a dedicated Lumen Redis deployment
lumen_redis_password:

# Lumen PostgreSQL LangGraph checkpointer password
lumen_checkpointer_postgres_password:

# Lumen pgvector memory store password
lumen_memory_pgvector_password:
