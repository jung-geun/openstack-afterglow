---
- name: Precheck | Verify enable_waygate is set
  ansible.builtin.assert:
    that:
      - enable_waygate is defined
    fail_msg: "enable_waygate must be set in globals.yml"
  run_once: true
  tags: precheck

- name: Precheck | Check required Waygate secrets
  ansible.builtin.assert:
    that:
      - waygate_database_password is defined and waygate_database_password | length > 0
      - waygate_keystone_password is defined and waygate_keystone_password | length > 0
      - waygate_encryption_key is defined and waygate_encryption_key | length == 64
      - waygate_encryption_key == afterglow_kubeconfig_encryption_key
    fail_msg: "Waygate DB/Keystone secrets must be set, and its encryption key must equal afterglow_kubeconfig_encryption_key during cutover"
  tags: precheck
  when: enable_waygate | bool

- name: Precheck | Validate Waygate public route hostname
  ansible.builtin.assert:
    that:
      - waygate_public_haproxy_fqdn is match('^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$')
      - (waygate_public_endpoint_url | regex_replace('/$', '')) == ('https://' ~ waygate_public_haproxy_fqdn)
    fail_msg: "waygate_public_endpoint_url must be the HTTPS origin for waygate_public_haproxy_fqdn"
  run_once: true
  tags: precheck
  when:
    - enable_waygate | bool
    - waygate_public_haproxy_enabled | bool

- name: Precheck | Validate enabled Waygate image references
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/validate_image_ref.py"
      - "{{ item.value.image }}"
      - "{{ waygate_source_mode | bool | lower }}"
  changed_when: false
  loop: "{{ waygate_services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  run_once: true
  delegate_to: "{{ groups['deployment'][0] }}"
  when:
    - enable_waygate | bool
    - item.value.enabled | bool

- name: Precheck | Inspect enabled remote Waygate image manifests
  become: true
  ansible.builtin.command:
    argv:
      - docker
      - manifest
      - inspect
      - "{{ item.value.image }}"
  changed_when: false
  loop: "{{ waygate_services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  run_once: true
  delegate_to: "{{ groups['waygate'] | first }}"
  when:
    - enable_waygate | bool
    - item.value.enabled | bool
    - not (waygate_source_mode | bool)
