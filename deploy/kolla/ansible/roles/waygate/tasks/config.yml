---
- name: Config | Ensure Waygate config directory exists
  become: true
  ansible.builtin.file:
    path: "{{ waygate_config_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: root
  when: inventory_hostname in groups['waygate']

- name: Config | Render waygate.conf
  become: true
  ansible.builtin.template:
    src: waygate.conf.j2
    dest: "{{ waygate_config_dir }}/waygate.conf"
    mode: "0640"
    owner: root
    group: root
  when: inventory_hostname in groups['waygate']
  notify:
    - Restart waygate-api container
    - Restart waygate-worker container

- name: Config | Ensure HAProxy services.d directory exists
  become: true
  ansible.builtin.file:
    path: "{{ waygate_haproxy_services_d }}"
    state: directory
    mode: "0755"
  when: inventory_hostname in groups['haproxy']

- name: Config | Render haproxy waygate.cfg
  become: true
  ansible.builtin.template:
    src: haproxy-waygate.cfg.j2
    dest: "{{ waygate_haproxy_services_d }}/waygate.cfg"
    mode: "0644"
  when: inventory_hostname in groups['haproxy']
  notify: Restart haproxy container
