---
- name: Pull | Pull Waygate images
  become: true
  community.docker.docker_image:
    name: "{{ item.value.image }}"
    source: pull
    force_source: true
  loop: "{{ waygate_services | dict2items }}"
  when:
    - inventory_hostname in groups['waygate']
    - item.value.enabled | bool
    - not (waygate_source_mode | default(false) | bool)
