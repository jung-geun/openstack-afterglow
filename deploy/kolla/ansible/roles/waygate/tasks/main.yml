---
- name: Validate requested Waygate lifecycle action
  ansible.builtin.assert:
    that:
      - kolla_action | default('deploy') in ['precheck', 'pull', 'deploy', 'reconfigure', 'upgrade', 'destroy']
    fail_msg: "Unsupported kolla_action '{{ kolla_action | default('deploy') }}' for waygate"
  tags: always

- name: Run requested Waygate lifecycle action
  ansible.builtin.include_tasks: "{{ kolla_action | default('deploy') }}.yml"
  tags: always
