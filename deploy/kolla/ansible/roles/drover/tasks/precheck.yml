---
- name: Precheck | Verify enable_drover is set
  ansible.builtin.assert:
    that:
      - enable_drover is defined
    fail_msg: "enable_drover must be set in globals.yml"
  run_once: true
  tags: precheck

- name: Precheck | Check required Drover secrets
  ansible.builtin.assert:
    that:
      - drover_database_password is defined and drover_database_password | length > 0
      - drover_keystone_password is defined and drover_keystone_password | length > 0
      - drover_kubeconfig_encryption_key is defined and drover_kubeconfig_encryption_key | length == 64
      - drover_kubeconfig_encryption_key == afterglow_kubeconfig_encryption_key
    fail_msg: "Drover DB/Keystone secrets must be set, and its encryption key must equal afterglow_kubeconfig_encryption_key during cutover"
  tags: precheck
  when: enable_drover | bool

- name: Precheck | Verify Drover API image accessibility
  become: true
  ansible.builtin.command:
    cmd: "docker manifest inspect {{ drover_api_image }}:{{ drover_image_tag }}"
  register: drover_image_check
  failed_when: false
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['drover'] | first }}"
  tags: precheck
  when: enable_drover | bool

- name: Precheck | Warn if Drover API image is inaccessible
  ansible.builtin.debug:
    msg: "WARNING: Cannot access {{ drover_api_image }}:{{ drover_image_tag }}. Ensure registry credentials are configured."
  when:
    - enable_drover | bool
    - drover_image_check is defined
    - drover_image_check.rc != 0
  run_once: true
  tags: precheck
