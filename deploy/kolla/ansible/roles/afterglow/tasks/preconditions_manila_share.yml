---
- name: "Manila | Check if share {{ share_item.value.name }} exists"
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: command
    module_args:
      cmd: >-
        openstack --os-cloud=kolla --os-share-api-version={{ afterglow_manila_microversion }}
        share show {{ share_item.value.name }} -f value -c id
      creates: null
  register: share_show_result
  failed_when: false
  run_once: true
  delegate_to: "{{ groups['afterglow'][0] }}"

- name: "Manila | Create share {{ share_item.value.name }} if not exists"
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: command
    module_args:
      cmd: >-
        openstack --os-cloud=kolla --os-share-api-version={{ afterglow_manila_microversion }}
        share create {{ share_item.value.protocol }}
        {{ share_item.value.size_gb }}
        --name {{ share_item.value.name }}
        --share-type {{ afterglow_manila_share_type }}
        -f value -c id
  register: share_create_result
  when: share_show_result.rc != 0 or share_show_result.stdout | trim | length == 0
  run_once: true
  delegate_to: "{{ groups['afterglow'][0] }}"

- name: "Manila | Resolve share ID for {{ share_item.value.name }}"
  ansible.builtin.set_fact:
    _afterglow_current_share_id: >-
      {{ share_show_result.stdout | trim
         if (share_show_result.rc == 0 and share_show_result.stdout | trim | length > 0)
         else share_create_result.stdout | trim }}
  run_once: true
  delegate_to: "{{ groups['afterglow'][0] }}"

- name: "Manila | Store share ID for key {{ share_item.key }}"
  ansible.builtin.set_fact:
    afterglow_share_ids: >-
      {{ afterglow_share_ids | default({}) | combine({share_item.key: _afterglow_current_share_id}) }}
  run_once: true
  delegate_to: "{{ groups['afterglow'][0] }}"

- name: "Manila | Wait for share {{ share_item.value.name }} to be available"
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: command
    module_args:
      cmd: >-
        openstack --os-cloud=kolla --os-share-api-version={{ afterglow_manila_microversion }}
        share show {{ share_item.value.name }} -f value -c status
  register: share_status
  until: share_status.stdout | trim == 'available'
  retries: 30
  delay: 10
  when: share_show_result.rc != 0 or share_show_result.stdout | trim | length == 0
  run_once: true
  delegate_to: "{{ groups['afterglow'][0] }}"

- name: "Manila | Check CephX access rule for {{ share_item.value.name }}"
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: command
    module_args:
      cmd: >-
        openstack --os-cloud=kolla --os-share-api-version={{ afterglow_manila_microversion }}
        share access list {{ share_item.value.name }}
        -f value -c access_to
  register: access_rule_check
  failed_when: false
  run_once: true
  delegate_to: "{{ groups['afterglow'][0] }}"

- name: "Manila | Create CephX access rule for {{ share_item.value.name }}"
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: command
    module_args:
      cmd: >-
        openstack --os-cloud=kolla --os-share-api-version={{ afterglow_manila_microversion }}
        share access create {{ share_item.value.name }}
        cephx {{ afterglow_cephx_user }}
        --access-level {{ share_item.value.access_level }}
  when: afterglow_cephx_user not in (access_rule_check.stdout | default(''))
  run_once: true
  delegate_to: "{{ groups['afterglow'][0] }}"
