---
- name: Bootstrap | Run DB schema initialization
  become: true
  community.docker.docker_container:
    name: afterglow_bootstrap
    image: "{{ afterglow_backend_image_ref }}"
    command:
      - python
      - -c
      - |
        import asyncio
        import os
        from app.database import close_db, create_tables, init_db

        async def main():
            try:
                init_db(os.environ["DATABASE_URL"])
                await create_tables()
            finally:
                await close_db()

        asyncio.run(main())
    state: started
    detach: false
    cleanup: true
    volumes:
      - "{{ afterglow_config_dir }}/afterglow.conf:/app/afterglow.conf:ro"
    env:
      DATABASE_URL: "{{ afterglow_database_url }}"
      REDIS_URL: "{{ afterglow_redis_url }}"
  no_log: true
  run_once: true
  delegate_to: "{{ groups['afterglow'] | first }}"

- name: Bootstrap | Show bootstrap output
  ansible.builtin.debug:
    msg: "Afterglow database bootstrap completed successfully"
  run_once: true
