---
- name: Seed | Reconcile baseline runtime placement policies
  become: true
  community.docker.docker_container:
    name: afterglow_seed_runtime_policies
    image: "{{ afterglow_backend_image_ref }}"
    command:
      - python
      - scripts/import_runtime_infrastructure_settings.py
      - --config
      - /app/afterglow.conf
      - --apply
    state: started
    detach: false
    network_mode: host
    groups: ["0"]
    cleanup: true
    volumes:
      - "{{ afterglow_runtime_config_dir }}/{{ afterglow_generated_config_name }}:/app/afterglow.conf:ro"
      - "{{ afterglow_runtime_config_dir }}/{{ afterglow_operator_config_name }}:/app/{{ afterglow_operator_config_name }}:ro"
      - "{{ afterglow_runtime_config_dir }}/{{ afterglow_kolla_config_name }}:/app/{{ afterglow_kolla_config_name }}:ro"
    env:
      DATABASE_URL: "{{ afterglow_database_url }}"
      REDIS_URL: "{{ afterglow_redis_url }}"
  no_log: true
  run_once: true
  delegate_to: "{{ groups['afterglow'] | first }}"

- name: Seed | Show seed output
  ansible.builtin.debug:
    msg: "Afterglow runtime placement policies seeded successfully"
  run_once: true
