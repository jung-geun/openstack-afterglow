---
- name: Config | Ensure afterglow config directory exists
  become: true
  ansible.builtin.file:
    path: "{{ afterglow_config_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: root
  when: inventory_hostname in groups['afterglow']

- name: Config | Render afterglow.conf
  become: true
  ansible.builtin.template:
    src: afterglow.conf.j2
    dest: "{{ afterglow_config_dir }}/afterglow.conf"
    mode: "0640"
    owner: root
    group: root
  when: inventory_hostname in groups['afterglow']
  notify:
    - Restart afterglow-backend container
    - Restart afterglow-notion-worker container
    - Restart afterglow-palimpsest-worker container

- name: Config | Ensure haproxy services.d directory exists
  become: true
  ansible.builtin.file:
    path: "{{ afterglow_haproxy_services_d }}"
    state: directory
    mode: "0755"
  when: inventory_hostname in groups['haproxy']

- name: Config | Render haproxy afterglow.cfg
  become: true
  ansible.builtin.template:
    src: haproxy-afterglow.cfg.j2
    dest: "{{ afterglow_haproxy_services_d }}/afterglow.cfg"
    mode: "0644"
  when: inventory_hostname in groups['haproxy']
  notify: Restart haproxy container
