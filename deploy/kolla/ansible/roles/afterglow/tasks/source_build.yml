---
- name: Source Build | Ensure Afterglow source checkout parent directory exists
  become: true
  ansible.builtin.file:
    path: "{{ afterglow_source_dir | dirname }}"
    state: directory
    mode: "0755"
  when: inventory_hostname in groups['afterglow']

- name: Source Build | Check if source repository .git directory exists
  become: true
  ansible.builtin.stat:
    path: "{{ afterglow_source_dir }}/.git"
  register: afterglow_git_stat
  when: inventory_hostname in groups['afterglow']

- name: Source Build | Check git status for existing repository
  become: true
  ansible.builtin.command:
    cmd: "git status --porcelain"
    chdir: "{{ afterglow_source_dir }}"
  register: afterglow_git_status
  changed_when: false
  when:
    - inventory_hostname in groups['afterglow']
    - afterglow_git_stat.stat.exists | default(false) | bool

- name: Source Build | Check git HEAD SHA for existing repository
  become: true
  ansible.builtin.command:
    cmd: "git rev-parse HEAD"
    chdir: "{{ afterglow_source_dir }}"
  register: afterglow_existing_head_sha
  changed_when: false
  when:
    - inventory_hostname in groups['afterglow']
    - afterglow_git_stat.stat.exists | default(false) | bool

- name: Source Build | Fail if existing checkout is dirty or SHA does not match expected version
  ansible.builtin.assert:
    that:
      - afterglow_git_status.stdout | trim == ""
      - afterglow_existing_head_sha.stdout | trim == afterglow_source_version
    fail_msg: "Existing Afterglow source repository at {{ afterglow_source_dir }} is dirty or HEAD ({{ afterglow_existing_head_sha.stdout | default('') | trim }}) does not match expected version ({{ afterglow_source_version }})"
  when:
    - inventory_hostname in groups['afterglow']
    - afterglow_git_stat.stat.exists | default(false) | bool

- name: Source Build | Clone Afterglow source repository
  become: true
  ansible.builtin.git:
    repo: "{{ afterglow_source_repo }}"
    dest: "{{ afterglow_source_dir }}"
    version: "{{ afterglow_source_version }}"
    force: false
  register: afterglow_git_clone
  when:
    - inventory_hostname in groups['afterglow']
    - not (afterglow_git_stat.stat.exists | default(false) | bool)

- name: Source Build | Verify final checked out HEAD SHA
  become: true
  ansible.builtin.command:
    cmd: "git rev-parse HEAD"
    chdir: "{{ afterglow_source_dir }}"
  register: afterglow_final_head_sha
  changed_when: false
  when: inventory_hostname in groups['afterglow']

- name: Source Build | Fail if final checked out HEAD does not match expected version
  ansible.builtin.assert:
    that:
      - afterglow_final_head_sha.stdout | trim == afterglow_source_version
    fail_msg: "Afterglow source checkout HEAD ({{ afterglow_final_head_sha.stdout | default('') | trim }}) does not match expected version ({{ afterglow_source_version }})"
  when: inventory_hostname in groups['afterglow']

- name: Source Build | Build local Afterglow images
  become: true
  community.docker.docker_image:
    name: "afterglow-local/{{ item }}:{{ afterglow_source_version | truncate(12, True, '') }}"
    build:
      path: "{{ afterglow_source_dir }}"
      target: "{{ item }}"
    source: build
    force_source: false
  loop:
    - backend
    - frontend
    - worker
  when: inventory_hostname in groups['afterglow']
