---
# Lumen kolla role defaults

lumen_image_tag: "{{ afterglow_image_tag | default('latest') }}"
lumen_api_image: "{{ afterglow_image_namespace | default('ghcr.io/openstack-afterglow') }}/lumen-api"
lumen_worker_image: "{{ afterglow_image_namespace | default('ghcr.io/openstack-afterglow') }}/lumen-worker"

enable_lumen: "no"
enable_lumen_api: "{{ enable_lumen }}"
enable_lumen_worker: "{{ enable_lumen }}"
lumen_run_preconditions: true

lumen_api_port: 8012
lumen_database_name: "lumen"
lumen_database_user: "lumen"
lumen_redis_db_index: 8

lumen_keystone_user: "lumen"
lumen_service_project_name: "lumen-service"
lumen_external_url: "{{ public_protocol | default('https') }}://{{ kolla_external_fqdn | default('localhost') }}:{{ lumen_api_port }}"

# Existing Lumen ciphertext was derived from this Afterglow master key; cutover must keep it byte-compatible.
lumen_encryption_key: "{{ afterglow_kubeconfig_encryption_key | default('') }}"
# Authenticates Lumen's workload to Afterglow's opaque delegated-MCP bridge.
# It is distinct from user Keystone and personal MCP credentials.
lumen_mcp_service_token: "{{ afterglow_lumen_mcp_service_token | default('') }}"
lumen_mcp_control_plane_url: "{{ public_protocol | default('https') }}://{{ kolla_internal_fqdn | default(kolla_internal_vip_address) }}"

# Lumen PostgreSQL LangGraph Checkpointer
lumen_enable_checkpointer: true
lumen_checkpointer_postgres_db: "lumen_checkpointer"
lumen_checkpointer_postgres_user: "lumen_checkpointer"
lumen_checkpointer_postgres_host: "{{ database_address | default('localhost') }}"
lumen_checkpointer_postgres_port: 5432
lumen_checkpointer_postgres_url: "postgresql://{{ lumen_checkpointer_postgres_user }}:{{ lumen_checkpointer_postgres_password | default('') }}@{{ lumen_checkpointer_postgres_host }}:{{ lumen_checkpointer_postgres_port }}/{{ lumen_checkpointer_postgres_db }}"

# Lumen pgvector Semantic Memory Store
lumen_enable_pgvector: true
lumen_memory_pgvector_db: "lumen_pgvector"
lumen_memory_pgvector_user: "lumen_pgvector"
lumen_memory_pgvector_host: "{{ database_address | default('localhost') }}"
lumen_memory_pgvector_port: 5432
lumen_memory_pgvector_url: "postgresql://{{ lumen_memory_pgvector_user }}:{{ lumen_memory_pgvector_password | default('') }}@{{ lumen_memory_pgvector_host }}:{{ lumen_memory_pgvector_port }}/{{ lumen_memory_pgvector_db }}"

# Lumen S3 Asset Storage
lumen_s3_endpoint_url: ""
lumen_s3_bucket: "lumen-assets"
lumen_s3_access_key: ""
lumen_s3_secret_key: ""
lumen_s3_region: "us-east-1"

# Lumen Sandbox & External Chat API Hosts
lumen_sandbox_api_key: ""
lumen_chat_api_hosts: ""

lumen_services:
  lumen-api:
    container_name: lumen_api
    group: lumen
    enabled: "{{ enable_lumen_api | bool }}"
    image: "{{ lumen_api_image }}:{{ lumen_image_tag }}"
    restart_policy: unless-stopped
    volumes:
      - "/etc/kolla/lumen/lumen.conf:/etc/lumen/lumen.conf:ro"
      - "kolla_logs:/var/log/kolla/"
    environment:
      LUMEN_CONFIG_FILE: "/etc/lumen/lumen.conf"
      DATABASE_URL: "mysql+aiomysql://{{ lumen_database_user }}:{{ lumen_database_password }}@{{ database_address | default('mariadb') }}:{{ database_port | default(3306) }}/{{ lumen_database_name }}"
      REDIS_URL: "redis://:{{ lumen_redis_password | default('') }}@{{ valkey_address | default('valkey') }}:{{ valkey_port | default(6379) }}/{{ lumen_redis_db_index }}"
      KEYSTONE_AUTH_URL: "{{ keystone_internal_url | default('http://' ~ kolla_internal_vip_address ~ ':5000/v3') }}"
      KEYSTONE_ADMIN_USERNAME: "{{ lumen_keystone_user }}"
      KEYSTONE_ADMIN_PASSWORD: "{{ lumen_keystone_password }}"
      KEYSTONE_ADMIN_PROJECT: "{{ lumen_service_project_name }}"
      KEYSTONE_DOMAIN: "Default"
      KEYSTONE_REGION_NAME: "{{ openstack_region_name | default('RegionOne') }}"
      KEYSTONE_INTERFACE: "internal"
      LUMEN_ENCRYPTION_KEY: "{{ lumen_encryption_key }}"
      MCP_CONTROL_PLANE_URL: "{{ lumen_mcp_control_plane_url }}"
      LUMEN_MCP_SERVICE_TOKEN: "{{ lumen_mcp_service_token }}"
      CHAT_CHECKPOINTER_POSTGRES_URL: "{{ lumen_checkpointer_postgres_url }}"
      CHAT_MEMORY_PGVECTOR_URL: "{{ lumen_memory_pgvector_url }}"
      CHAT_ASSET_S3_ACCESS_KEY: "{{ lumen_s3_access_key }}"
      CHAT_ASSET_S3_SECRET_KEY: "{{ lumen_s3_secret_key }}"
      CHAT_SANDBOX_API_KEY: "{{ lumen_sandbox_api_key }}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "{{ lumen_api_port }}:8012"

  lumen-worker:
    container_name: lumen_worker
    group: lumen
    enabled: "{{ enable_lumen_worker | bool }}"
    image: "{{ lumen_worker_image }}:{{ lumen_image_tag }}"
    command: ["python", "-m", "lumen.worker"]
    restart_policy: unless-stopped
    volumes:
      - "/etc/kolla/lumen/lumen.conf:/etc/lumen/lumen.conf:ro"
      - "kolla_logs:/var/log/kolla/"
    environment:
      LUMEN_CONFIG_FILE: "/etc/lumen/lumen.conf"
      DATABASE_URL: "mysql+aiomysql://{{ lumen_database_user }}:{{ lumen_database_password }}@{{ database_address | default('mariadb') }}:{{ database_port | default(3306) }}/{{ lumen_database_name }}"
      REDIS_URL: "redis://:{{ lumen_redis_password | default('') }}@{{ valkey_address | default('valkey') }}:{{ valkey_port | default(6379) }}/{{ lumen_redis_db_index }}"
      KEYSTONE_AUTH_URL: "{{ keystone_internal_url | default('http://' ~ kolla_internal_vip_address ~ ':5000/v3') }}"
      KEYSTONE_ADMIN_USERNAME: "{{ lumen_keystone_user }}"
      KEYSTONE_ADMIN_PASSWORD: "{{ lumen_keystone_password }}"
      KEYSTONE_ADMIN_PROJECT: "{{ lumen_service_project_name }}"
      KEYSTONE_DOMAIN: "Default"
      KEYSTONE_REGION_NAME: "{{ openstack_region_name | default('RegionOne') }}"
      KEYSTONE_INTERFACE: "internal"
      LUMEN_ENCRYPTION_KEY: "{{ lumen_encryption_key }}"
      MCP_CONTROL_PLANE_URL: "{{ lumen_mcp_control_plane_url }}"
      LUMEN_MCP_SERVICE_TOKEN: "{{ lumen_mcp_service_token }}"
      CHAT_CHECKPOINTER_POSTGRES_URL: "{{ lumen_checkpointer_postgres_url }}"
      CHAT_MEMORY_PGVECTOR_URL: "{{ lumen_memory_pgvector_url }}"
      CHAT_ASSET_S3_ACCESS_KEY: "{{ lumen_s3_access_key }}"
      CHAT_ASSET_S3_SECRET_KEY: "{{ lumen_s3_secret_key }}"
      CHAT_SANDBOX_API_KEY: "{{ lumen_sandbox_api_key }}"
