---
- name: Precheck | Verify enable_lumen is set
  ansible.builtin.assert:
    that:
      - enable_lumen is defined
    fail_msg: "enable_lumen must be set in globals.yml"
  run_once: true
  tags: precheck

- name: Precheck | Check required Lumen secrets
  ansible.builtin.assert:
    that:
      - lumen_database_password is defined and lumen_database_password | length > 0
      - lumen_keystone_password is defined and lumen_keystone_password | length > 0
      - lumen_encryption_key is defined and lumen_encryption_key | length == 64
      - lumen_encryption_key == afterglow_kubeconfig_encryption_key
    fail_msg: "Lumen DB/Keystone secrets must be set, and its encryption key must equal afterglow_kubeconfig_encryption_key during cutover"
  tags: precheck
  when: enable_lumen | bool

- name: Precheck | Verify Lumen checkpointer configuration if enabled (managed)
  ansible.builtin.assert:
    that:
      - lumen_postgres_password is defined and lumen_postgres_password | length > 0
    fail_msg: "lumen_postgres_password must be set when enable_lumen_postgres is true"
  tags: precheck
  when:
    - enable_lumen | bool
    - lumen_enable_checkpointer | bool
    - enable_lumen_postgres | bool

- name: Precheck | Verify Lumen checkpointer configuration if enabled (external)
  ansible.builtin.assert:
    that:
      - lumen_checkpointer_postgres_host is defined and lumen_checkpointer_postgres_host | length > 0
      - lumen_checkpointer_postgres_port is defined
      - lumen_checkpointer_postgres_password is defined and lumen_checkpointer_postgres_password | length > 0
    fail_msg: "Lumen checkpointer postgres host, port, and password must be set when lumen_enable_checkpointer is true and enable_lumen_postgres is false"
  tags: precheck
  when:
    - enable_lumen | bool
    - lumen_enable_checkpointer | bool
    - not (enable_lumen_postgres | bool)
- name: Precheck | Verify Lumen pgvector configuration if enabled
  ansible.builtin.assert:
    that:
      - lumen_memory_pgvector_host is defined and lumen_memory_pgvector_host | length > 0
      - lumen_memory_pgvector_port is defined
      - lumen_memory_pgvector_password is defined and lumen_memory_pgvector_password | length > 0
    fail_msg: "Lumen pgvector memory store host, port, and password must be set when lumen_enable_pgvector is true"
  tags: precheck
  when:
    - enable_lumen | bool
    - lumen_enable_pgvector | bool

- name: Precheck | Verify Lumen API image accessibility
  become: true
  ansible.builtin.command:
    cmd: "docker manifest inspect {{ lumen_api_image }}:{{ lumen_image_tag }}"
  register: lumen_image_check
  failed_when: false
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['lumen'] | first }}"
  tags: precheck
  when: enable_lumen | bool

- name: Precheck | Warn if Lumen API image is inaccessible
  ansible.builtin.debug:
    msg: "WARNING: Cannot access {{ lumen_api_image }}:{{ lumen_image_tag }}. Ensure registry credentials are configured."
  when:
    - enable_lumen | bool
    - lumen_image_check is defined
    - lumen_image_check.rc != 0
  run_once: true
  tags: precheck
