---
# Additive Plugin Override Sample for DMSLab Kolla-Ansible Deployment
# Place as /etc/kolla/afterglow/globals.yml and pass via:
#   kolla-ansible deploy -i /etc/kolla/inventory-afterglow \
#     -p /etc/kolla/.venv/share/kolla-ansible/ansible/afterglow-site.yml \
#     -e @/etc/kolla/afterglow/globals.yml \
#     -e @/etc/kolla/afterglow/secrets.yml

# ── 1. Service Toggles (DMSLab Topology) ──────────────────────────────────────
enable_afterglow: "yes"
enable_afterglow_backend: "yes"
enable_afterglow_frontend: "yes"
enable_afterglow_notion_worker: "no"
enable_afterglow_palimpsest_worker: "no"

enable_waygate: "yes"
enable_waygate_api: "yes"
enable_waygate_worker: "yes"

enable_drover: "yes"
enable_drover_api: "yes"
enable_drover_worker: "yes"

enable_lumen: "yes"
enable_lumen_api: "yes"
enable_lumen_worker: "yes"

# ── 2. Source Build & Image References ───────────────────────────────────────
# Build local images pinned to exact GitHub commits into plugin-owned checkouts.
# Replace each Afterglow placeholder with the full SHA of the implementation commit
# and its first 12 characters before deploying.
enable_afterglow_source_build: true
enable_drover_source_build: true
enable_lumen_source_build: true
enable_waygate_source_build: true
afterglow_source_checkout_path: "/opt/afterglow/src/openstack-afterglow"
afterglow_source_repo: "https://github.com/openstack-afterglow/openstack-afterglow.git"
afterglow_source_version: "<AFTERGLOW_IMPLEMENTATION_FULL_SHA>"

drover_source_checkout_path: "/opt/afterglow/src/drover"
drover_source_repo: "https://github.com/openstack-afterglow/drover.git"
drover_source_version: "2b82bc16fc432ce84b21390a67106f3afcc593a1"

lumen_source_checkout_path: "/opt/afterglow/src/lumen"
lumen_source_repo: "https://github.com/openstack-afterglow/lumen.git"
lumen_source_version: "c7d59a255148173232e5a4b32e90498dea5cee29"

waygate_source_checkout_path: "/opt/afterglow/src/waygate"
waygate_source_repo: "https://github.com/openstack-afterglow/waygate.git"
waygate_source_version: "e83ce559e3e3b08a4f28d7a46818b6c69b6c4cf3"

# Complete image refs (pinned local source builds with 12-character SHA tags).
afterglow_backend_image_ref: "afterglow-local/backend:<AFTERGLOW_SHA12>"
afterglow_frontend_image_ref: "afterglow-local/frontend:<AFTERGLOW_SHA12>"
drover_api_image_ref: "afterglow-local/drover-api:2b82bc16fc43"
drover_worker_image_ref: "afterglow-local/drover-worker:2b82bc16fc43"
waygate_api_image_ref: "afterglow-local/waygate-api:e83ce559e3e3"
waygate_worker_image_ref: "afterglow-local/waygate-worker:e83ce559e3e3"
lumen_api_image_ref: "afterglow-local/lumen-api:c7d59a255148"
lumen_worker_image_ref: "afterglow-local/lumen-worker:c7d59a255148"

# ── 3. Direct Internal VIP Listeners ──────────────────────────────────────────
# Bind API/UI host ports to kolla_internal_vip_address (172.30.0.253)
afterglow_external_url: "http://172.30.0.253:3080"
afterglow_backend_port: 8020
afterglow_public_api_base: "http://172.30.0.253:8020"
afterglow_openstack_interface: "internal"

# Preserve public DNS/TLS catalog URLs while internal and admin clients use VIP.
waygate_external_url: "https://waygate.dmslab.re.kr"
waygate_public_endpoint_url: "https://waygate.dmslab.re.kr"
waygate_internal_endpoint_url: "http://172.30.0.253:8010"
waygate_admin_endpoint_url: "http://172.30.0.253:8010"

drover_external_url: "https://drover.dmslab.re.kr"
drover_public_endpoint_url: "https://drover.dmslab.re.kr"
drover_internal_endpoint_url: "http://172.30.0.253:8011"
drover_admin_endpoint_url: "http://172.30.0.253:8011"

lumen_external_url: "http://172.30.0.253:8012"
lumen_public_endpoint_url: "http://172.30.0.253:8012"
lumen_internal_endpoint_url: "http://172.30.0.253:8012"
lumen_admin_endpoint_url: "http://172.30.0.253:8012"

# ── 4. MariaDB _kolla Schemas & Keystone Contracts ───────────────────────────
# Use dedicated plugin schemas to leave stock afterglow schema untouched
afterglow_database_name: "afterglow_kolla"
afterglow_database_user: "afterglow_kolla"
afterglow_admin_keystone_user: "afterglow_admin"
afterglow_service_project_name: "afterglow-service"

drover_database_name: "drover_kolla"
drover_database_user: "drover_kolla"
drover_keystone_user: "drover"
drover_service_project_name: "drover-service"

lumen_database_name: "lumen_kolla"
lumen_database_user: "lumen_kolla"
lumen_keystone_user: "lumen"
lumen_service_project_name: "lumen-service"

waygate_database_name: "waygate_kolla"
waygate_database_user: "waygate_kolla"
waygate_keystone_user: "waygate"
waygate_service_project_name: "waygate-service"

# Reuse Kolla's current Valkey primary with explicit plugin DB indexes. Kolla
# binds Valkey to controller API addresses, not the VIP; promotion requires an
# explicit plugin-config update because this direct connection has no failover.
afterglow_redis_db_index: 5
waygate_redis_db_index: 6
drover_redis_db_index: 7
lumen_redis_db_index: 8

# ── 6. Managed Lumen PostgreSQL Datastore ──────────────────────────────────────
# Managed PostgreSQL container on dms-controller1 for LangGraph checkpointer
enable_lumen_postgres: true
lumen_postgres_image_ref: "pgvector/pgvector:0.8.6-pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b"
lumen_postgres_database: "lumen"
lumen_postgres_user: "lumen"
lumen_postgres_bind_address: "172.30.0.11"
lumen_postgres_port: 5432

lumen_enable_checkpointer: true
lumen_checkpointer_postgres_url: "postgresql://lumen:{{ lumen_postgres_password }}@172.30.0.11:5432/lumen"

# Semantic memory disabled (no embedding provider configured in DMSLab)
lumen_enable_pgvector: false
lumen_memory_pgvector_url: ""
chat_semantic_memory_enabled: false

# ── 7. Feature Integrations & Scope Control ──────────────────────────────────
# Enable active Afterglow features
afterglow_service_k3s_enabled: true
afterglow_service_waygate_enabled: true
afterglow_service_chat_enabled: true
afterglow_service_mcp_enabled: true

# Disable optional integrations to avoid creating external OpenStack resources
afterglow_service_manila_enabled: false
afterglow_service_swift_enabled: false
afterglow_service_zun_enabled: false
afterglow_service_trove_enabled: false
afterglow_service_magnum_enabled: false
afterglow_service_barbican_enabled: false
