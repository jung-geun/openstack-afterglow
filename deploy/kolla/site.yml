---
# Kolla-Ansible site playbook integration for Afterglow services

- name: Gather facts for all hosts
  hosts: all
  serial: "{{ kolla_serial | default('0') }}"
  gather_facts: false
  tasks:
    - name: Gather facts
      ansible.builtin.setup:
        filter: "{{ kolla_ansible_setup_filter }}"
        gather_subset: "{{ kolla_ansible_setup_gather_subset }}"
      when:
        - not ansible_facts
  tags: always

- name: Apply role afterglow
  gather_facts: false
  hosts: afterglow
  serial: "{{ kolla_serial | default('0') }}"
  roles:
    - { role: afterglow, tags: afterglow, when: enable_afterglow | default(false) | bool }

- name: Apply role waygate
  gather_facts: false
  hosts: waygate
  serial: "{{ kolla_serial | default('0') }}"
  roles:
    - { role: waygate, tags: waygate, when: enable_waygate | default(false) | bool }

- name: Apply role drover
  gather_facts: false
  hosts: drover
  serial: "{{ kolla_serial | default('0') }}"
  roles:
    - { role: drover, tags: drover, when: enable_drover | default(false) | bool }

- name: Apply role lumen
  gather_facts: false
  hosts: lumen
  serial: "{{ kolla_serial | default('0') }}"
  roles:
    - { role: lumen, tags: lumen, when: enable_lumen | default(false) | bool }

- name: Configure plugin HAProxy routes
  gather_facts: false
  hosts: loadbalancer
  serial: "{{ kolla_serial | default('0') }}"
  tags: haproxy
  tasks:
    # Use Kolla's native config/check path. The check task recreates HAProxy only
    # when the resulting configuration hash changes.
    - name: Render Kolla HAProxy base configuration
      ansible.builtin.include_role:
        name: loadbalancer
        tasks_from: config
      tags: [afterglow, waygate, drover, lumen, haproxy]
      when: enable_haproxy | default(true) | bool

    - name: Render Afterglow HAProxy routes
      ansible.builtin.include_role:
        name: afterglow
        tasks_from: loadbalancer
      tags: [afterglow, haproxy]
      when:
        - enable_haproxy | default(true) | bool
        - enable_afterglow | default(false) | bool

    - name: Render Waygate HAProxy routes
      ansible.builtin.include_role:
        name: waygate
        tasks_from: loadbalancer
      tags: [waygate, haproxy]
      when:
        - enable_haproxy | default(true) | bool
        - enable_waygate | default(false) | bool

    - name: Render Drover HAProxy routes
      ansible.builtin.include_role:
        name: drover
        tasks_from: loadbalancer
      tags: [drover, haproxy]
      when:
        - enable_haproxy | default(true) | bool
        - enable_drover | default(false) | bool

    - name: Render Lumen HAProxy routes
      ansible.builtin.include_role:
        name: lumen
        tasks_from: loadbalancer
      tags: [lumen, haproxy]
      when:
        - enable_haproxy | default(true) | bool
        - enable_lumen | default(false) | bool

    - name: Reconcile Kolla HAProxy after plugin route changes
      ansible.builtin.include_role:
        name: loadbalancer
        tasks_from: check-containers
      tags: [afterglow, waygate, drover, lumen, haproxy]
      when: enable_haproxy | default(true) | bool
