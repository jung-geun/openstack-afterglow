apiVersion: apps/v1
kind: Deployment
metadata:
  name: palimpsest-worker
  namespace: afterglow
  labels:
    app: palimpsest-worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: palimpsest-worker
  template:
    metadata:
      labels:
        app: palimpsest-worker
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: palimpsest-worker
          image: ghcr.io/openstack-afterglow/afterglow-api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.palimpsest_worker"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: AFTERGLOW_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: DATABASE_URL
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: OS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: SECRET_KEY
            - name: PALIMPSEST_HUB_LOCAL_PATH
              value: "/var/lib/afterglow/palimpsest"
          volumeMounts:
            - name: afterglow-config-volume
              mountPath: /app/afterglow.conf
              subPath: afterglow.conf
            - name: palimpsest-hub
              mountPath: /var/lib/afterglow/palimpsest
          resources:
            requests:
              memory: "512Mi"
              cpu: "1"
            limits:
              memory: "2Gi"
              cpu: "4"
      volumes:
        - name: afterglow-config-volume
          configMap:
            name: afterglow-config
            items:
              - key: afterglow.conf
                path: afterglow.conf
        - name: palimpsest-hub
          persistentVolumeClaim:
            claimName: palimpsest-hub
