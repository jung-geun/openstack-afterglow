apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-worker
  namespace: afterglow
  labels:
    app: chat-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-worker
  template:
    metadata:
      labels:
        app: chat-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: chat-worker
          image: ghcr.io/openstack-afterglow/afterglow-api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.chat_worker"]
          env:
            - name: AFTERGLOW_ENV
              value: "production"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: afterglow-config
                  key: APP_REDIS_URL
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: OS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: SECRET_KEY
            - name: K3S_KUBECONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: K3S_KUBECONFIG_ENCRYPTION_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: DATABASE_URL
            - name: CHAT_CHECKPOINTER_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: CHAT_CHECKPOINTER_POSTGRES_URL
            - name: CHAT_MEMORY_PGVECTOR_URL
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: CHAT_MEMORY_PGVECTOR_URL
          volumeMounts:
            - name: afterglow-config-volume
              mountPath: /app/afterglow.conf
              subPath: afterglow.conf
      volumes:
        - name: afterglow-config-volume
          configMap:
            name: afterglow-config
            items:
              - key: afterglow.conf
                path: afterglow.conf
