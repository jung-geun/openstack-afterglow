apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: afterglow-ingress
  namespace: afterglow
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/service.serverstransport: afterglow-backend-long-timeout@kubernetescrd
    cert-manager.io/cluster-issuer: "letsencrypt-prod-traefik" # 위에서 만든 ClusterIssuer
spec:
  # TLS 설정 (HTTPS 사용 시 주석 해제 후 설정)
  tls:
    - hosts:
        - your-domain.example.com # 실제 도메인으로 변경 후 kubectl apply
      secretName: afterglow-tls # cert-manager가 발급한 인증서를 저장할 Secret
  rules:
    - host: your-domain.example.com # 실제 도메인으로 변경 후 kubectl apply
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3080
