apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: afterglow-ingress
  namespace: afterglow
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/service.serverstransport: afterglow-backend-long-timeout@kubernetescrd
    cert-manager.io/cluster-issuer: "letsencrypt-prod-traefik" # 위에서 만든 ClusterIssuer
spec:
  # TLS 설정 (HTTPS 사용 시 주석 해제 후 설정)
  tls:
    - hosts:
        - afterglow.example.com      # 실제 도메인으로 변경
        - api.afterglow.example.com  # 외부 API 전용 서브도메인(아래 규칙과 함께 사용)
      secretName: afterglow-tls      # cert-manager 또는 수동으로 생성한 TLS Secret 이름
  rules:
    # 기본 host — 웹 앱(/) + 내부 API(/api). 외부 /v1 은 여기서 노출하지 않는다.
    - host: afterglow.example.com # 실제 도메인으로 변경
      http:
        paths:
          # MCP OAuth discovery (RFC 9728 / RFC 8414) lives at the origin root, not under /api —
          # backend/app/api/mcp.py root_router. cert-manager 의 HTTP-01 solver Ingress 는 더 긴
          # /.well-known/acme-challenge/<token> 규칙을 쓰므로 Traefik 우선순위에서 앞서고,
          # 인증서 발급은 이 규칙의 영향을 받지 않는다.
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3080
    # /v1 은 Lumen 서비스(포트 8012)가 제공한다. 이 manifest 는 Lumen 을 배포하지 않으므로, Lumen 을 운영하지 않는다면 이 host 규칙 전체를 삭제한다. Lumen 의 [chat] api_hosts 에 이 호스트를 등록해야 한다(이중 방어).
    - host: api.afterglow.example.com # 실제 API 서브도메인으로 변경 (예: api.cloud.dmslab.re.kr)
      http:
        paths:
          # MCP OAuth discovery (RFC 9728 / RFC 8414) lives at the origin root, not under /api —
          # backend/app/api/mcp.py root_router. cert-manager 의 HTTP-01 solver Ingress 는 더 긴
          # /.well-known/acme-challenge/<token> 규칙을 쓰므로 Traefik 우선순위에서 앞서고,
          # 인증서 발급은 이 규칙의 영향을 받지 않는다.
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: lumen
                port:
                  number: 8012
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3080
