name: afterglow-dev-test

# Disposable MariaDB for local chat integration tests only.
# Start: docker compose -f docker-compose.dev.yaml up -d --wait
# Test:  AFTERGLOW_TEST_DATABASE_URL=mysql+aiomysql://afterglow:dev@127.0.0.1:3307/afterglow_test npm run test:target -- backend:tests/test_chat_db_integration.py
# Stop:  docker compose -f docker-compose.dev.yaml down -v
services:
  mariadb-test:
    image: mariadb:11.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: dev
      MARIADB_DATABASE: afterglow_test
      MARIADB_USER: afterglow
      MARIADB_PASSWORD: dev
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
